version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: investorscope-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: investorscope
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: investorscope-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  ollama:
    image: ollama/ollama
    container_name: investorscope-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # NOTE: You will need to manually run `docker exec -it investorscope-ollama ollama run llama3.1:8b` and `nomic-embed-text`
    # after the container starts to download the models.

volumes:
  postgres_data:
  redis_data:
  ollama_data:
